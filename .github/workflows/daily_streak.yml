name: LeetCode Daily Streak Bot

on:
  schedule:
    # Runs at 01:30 AM UTC everyday (LeetCode resets at 00:00 UTC)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  solve-daily-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LeetCode Streak Solver
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "qwen/qwen3.6-27b"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: "LeetCode Bot <onboarding@resend.dev>"
          PROGRAMMING_LANGUAGE: "python3"
        run: |
          python main.py
