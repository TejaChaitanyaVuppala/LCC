name: LeetCode Daily Streak & Multi-Problem Bot

on:
  schedule:
    # 1. 07:00 AM IST (01:30 UTC) -> Problem of the Day (POTD)
    - cron: '30 1 * * *'
    # 2. 10:30 AM IST (05:00 UTC) -> Extra Problem #1
    - cron: '0 5 * * *'
    # 3. 02:30 PM IST (09:00 UTC) -> Extra Problem #2
    - cron: '0 9 * * *'
    # 4. 06:30 PM IST (13:00 UTC) -> Extra Problem #3
    - cron: '0 13 * * *'
    # 5. 10:00 PM IST (16:30 UTC) -> Extra Problem #4
    - cron: '30 16 * * *'
    # 6. 01:30 AM IST (20:00 UTC) -> Extra Problem #5
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Problem Solving Mode'
        required: true
        default: 'potd'
        type: choice
        options:
          - potd
          - extra
          - batch
      extra_index:
        description: 'Extra problem index (1-5, optional)'
        required: false
        default: ''
        type: string
      difficulty:
        description: 'Difficulty filter'
        required: false
        default: 'RANDOM'
        type: choice
        options:
          - RANDOM
          - EASY
          - MEDIUM
          - HARD
      problem_count:
        description: 'Problem count for batch mode'
        required: false
        default: '5'
        type: string

env:
  TZ: "Asia/Kolkata"

concurrency:
  group: leetcode-streak-workflow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  solve-leetcode:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Run Mode & Parameters
        id: params
        shell: bash
        run: |
          CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S %Z')
          CURRENT_HOUR=$(date +%-H)
          echo "Current IST Time: $CURRENT_TIME"
          echo "Current IST Hour: $CURRENT_HOUR"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Execution Mode: Manual Trigger (workflow_dispatch)"
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "difficulty=${{ github.event.inputs.difficulty }}" >> $GITHUB_OUTPUT
            echo "extra_index=${{ github.event.inputs.extra_index }}" >> $GITHUB_OUTPUT
            echo "problem_count=${{ github.event.inputs.problem_count }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "schedule" ] && [ -n "${{ github.event.schedule }}" ]; then
            SCHEDULE_CRON="${{ github.event.schedule }}"
            echo "Execution Mode: Scheduled Trigger (Cron: '$SCHEDULE_CRON')"
            case "$SCHEDULE_CRON" in
              "30 1 * * *")
                # 07:00 AM IST -> Problem of the Day
                echo "mode=potd" >> $GITHUB_OUTPUT
                echo "extra_index=" >> $GITHUB_OUTPUT
                ;;
              "0 5 * * *")
                # 10:30 AM IST -> Extra Problem #1
                echo "mode=extra" >> $GITHUB_OUTPUT
                echo "extra_index=1" >> $GITHUB_OUTPUT
                ;;
              "0 9 * * *")
                # 02:30 PM IST -> Extra Problem #2
                echo "mode=extra" >> $GITHUB_OUTPUT
                echo "extra_index=2" >> $GITHUB_OUTPUT
                ;;
              "0 13 * * *")
                # 06:30 PM IST -> Extra Problem #3
                echo "mode=extra" >> $GITHUB_OUTPUT
                echo "extra_index=3" >> $GITHUB_OUTPUT
                ;;
              "30 16 * * *")
                # 10:00 PM IST -> Extra Problem #4
                echo "mode=extra" >> $GITHUB_OUTPUT
                echo "extra_index=4" >> $GITHUB_OUTPUT
                ;;
              "0 20 * * *")
                # 01:30 AM IST -> Extra Problem #5
                echo "mode=extra" >> $GITHUB_OUTPUT
                echo "extra_index=5" >> $GITHUB_OUTPUT
                ;;
              *)
                # Fallback to IST hour window
                if [ "$CURRENT_HOUR" -le 4 ]; then
                  echo "mode=extra" >> $GITHUB_OUTPUT
                  echo "extra_index=5" >> $GITHUB_OUTPUT
                elif [ "$CURRENT_HOUR" -le 8 ]; then
                  echo "mode=potd" >> $GITHUB_OUTPUT
                  echo "extra_index=" >> $GITHUB_OUTPUT
                elif [ "$CURRENT_HOUR" -le 12 ]; then
                  echo "mode=extra" >> $GITHUB_OUTPUT
                  echo "extra_index=1" >> $GITHUB_OUTPUT
                elif [ "$CURRENT_HOUR" -le 16 ]; then
                  echo "mode=extra" >> $GITHUB_OUTPUT
                  echo "extra_index=2" >> $GITHUB_OUTPUT
                elif [ "$CURRENT_HOUR" -le 20 ]; then
                  echo "mode=extra" >> $GITHUB_OUTPUT
                  echo "extra_index=3" >> $GITHUB_OUTPUT
                else
                  echo "mode=extra" >> $GITHUB_OUTPUT
                  echo "extra_index=4" >> $GITHUB_OUTPUT
                fi
                ;;
            esac
            echo "difficulty=RANDOM" >> $GITHUB_OUTPUT
            echo "problem_count=1" >> $GITHUB_OUTPUT
          else
            echo "Execution Mode: Dynamic Fallback based on IST hour"
            if [ "$CURRENT_HOUR" -le 4 ]; then
              # 00:00 - 04:59 IST (Target: 01:30 AM IST) -> Extra Problem #5
              echo "mode=extra" >> $GITHUB_OUTPUT
              echo "extra_index=5" >> $GITHUB_OUTPUT
            elif [ "$CURRENT_HOUR" -le 8 ]; then
              # 05:00 - 08:59 IST (Target: 07:00 AM IST) -> Problem of the Day
              echo "mode=potd" >> $GITHUB_OUTPUT
              echo "extra_index=" >> $GITHUB_OUTPUT
            elif [ "$CURRENT_HOUR" -le 12 ]; then
              # 09:00 - 12:59 IST (Target: 10:30 AM IST) -> Extra Problem #1
              echo "mode=extra" >> $GITHUB_OUTPUT
              echo "extra_index=1" >> $GITHUB_OUTPUT
            elif [ "$CURRENT_HOUR" -le 16 ]; then
              # 13:00 - 16:59 IST (Target: 02:30 PM IST) -> Extra Problem #2
              echo "mode=extra" >> $GITHUB_OUTPUT
              echo "extra_index=2" >> $GITHUB_OUTPUT
            elif [ "$CURRENT_HOUR" -le 20 ]; then
              # 17:00 - 20:59 IST (Target: 06:30 PM IST) -> Extra Problem #3
              echo "mode=extra" >> $GITHUB_OUTPUT
              echo "extra_index=3" >> $GITHUB_OUTPUT
            else
              # 21:00 - 23:59 IST (Target: 10:00 PM IST) -> Extra Problem #4
              echo "mode=extra" >> $GITHUB_OUTPUT
              echo "extra_index=4" >> $GITHUB_OUTPUT
            fi
            echo "difficulty=RANDOM" >> $GITHUB_OUTPUT
            echo "problem_count=1" >> $GITHUB_OUTPUT
          fi

      - name: Run LeetCode Solver
        env:
          TZ: "Asia/Kolkata"
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.6-flash"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "qwen/qwen3.6-27b"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: "LeetCode Bot <onboarding@resend.dev>"
          PROGRAMMING_LANGUAGE: "python3"
        run: |
          EXTRA_FLAG=""
          if [ -n "${{ steps.params.outputs.extra_index }}" ]; then
            EXTRA_FLAG="--extra-index ${{ steps.params.outputs.extra_index }}"
          fi
          
          python main.py \
            --mode ${{ steps.params.outputs.mode }} \
            --difficulty ${{ steps.params.outputs.difficulty }} \
            --count ${{ steps.params.outputs.problem_count }} \
            $EXTRA_FLAG

      - name: Persist Solved History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "solved_history.json" ]; then
            git add solved_history.json
            if ! git diff --staged --quiet; then
              git commit -m "Update solved_history.json [skip ci]"
              for attempt in 1 2 3; do
                echo "Attempt $attempt: Pulling latest changes and pushing history..."
                git pull --rebase origin main || true
                if git push origin HEAD:main; then
                  echo "Successfully pushed updated solved_history.json."
                  break
                fi
                sleep 5
              done
            fi
          fi
